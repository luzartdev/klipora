name: Feature request
description: Suggest a focused improvement to Klipora.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      description: Describe the user need and current limitation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      description: Explain the behavior you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches that could solve the same problem?
